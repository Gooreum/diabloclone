# main 에 push 하면 게임 코드만 빌드해 GitHub Pages 에 배포한다 (원작 MPQ 는 저장소에 없고, 유저가 브라우저에서 직접 불러온다)
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          PAGES_BASE: /diabloclone/
      - name: 원작 파일이 빌드에 섞이지 않았는지 확인
        run: test -z "$(find dist -iname '*.mpq')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
